<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="xsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b3122"/><stop offset="60%" stop-color="#15533c"/><stop offset="100%" stop-color="#E3A92E" stop-opacity=".2"/>
    </linearGradient>
    <radialGradient id="xsun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F4D27A"/><stop offset="50%" stop-color="#E3A92E" stop-opacity=".7"/><stop offset="100%" stop-color="#E3A92E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="xvig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="45%" stop-color="#06180f" stop-opacity="0"/><stop offset="100%" stop-color="#05140d" stop-opacity=".92"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#xsky)"/>
  <circle cx="1120" cy="430" r="300" fill="url(#xsun)"/>
  <!-- distant fields -->
  <path d="M0 620 Q 500 560 1100 600 T 1600 590 V900 H0 Z" fill="#0e3b2e"/>
  <path d="M0 690 Q 600 640 1200 680 T 1600 670 V900 H0 Z" fill="#0a2c20"/>
  <!-- lone tree (agriculture + future) -->
  <g transform="translate(360,620)">
    <rect x="-8" y="-10" width="16" height="120" rx="5" fill="#0a2418"/>
    <circle cx="0" cy="-40" r="78" fill="#103b2c"/>
    <circle cx="-40" cy="-20" r="50" fill="#0e3322"/>
    <circle cx="42" cy="-20" r="50" fill="#0e3322"/>
    <circle cx="0" cy="-80" r="44" fill="#124734"/>
  </g>
  <!-- crop rows converging -->
  <g stroke="#2E8B70" stroke-opacity=".35">
    <line x1="760" y1="720" x2="500" y2="900"/><line x1="860" y1="720" x2="780" y2="900"/>
    <line x1="960" y1="720" x2="1060" y2="900"/><line x1="1060" y1="720" x2="1340" y2="900"/>
  </g>
  <rect width="1600" height="900" fill="url(#xvig)"/>
</svg>
