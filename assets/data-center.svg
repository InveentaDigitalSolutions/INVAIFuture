<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E3B2E"/><stop offset="100%" stop-color="#05140d"/>
    </linearGradient>
    <linearGradient id="drack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15533f"/><stop offset="100%" stop-color="#0a2c20"/>
    </linearGradient>
    <linearGradient id="dvig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="35%" stop-color="#05140d" stop-opacity="0"/><stop offset="100%" stop-color="#040f0a" stop-opacity=".92"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#dbg)"/>
  <!-- perspective floor lines -->
  <g stroke="#2E8B70" stroke-opacity=".25">
    <line x1="800" y1="460" x2="-200" y2="900"/><line x1="800" y1="460" x2="1800" y2="900"/>
    <line x1="800" y1="460" x2="300" y2="900"/><line x1="800" y1="460" x2="1300" y2="900"/>
  </g>
  <!-- server racks rows -->
  <g>
    <!-- back row -->
    <g opacity=".75">
      <rect x="560" y="300" width="90" height="170" rx="6" fill="url(#drack)" stroke="#3aa581" stroke-opacity=".4"/>
      <rect x="670" y="300" width="90" height="170" rx="6" fill="url(#drack)" stroke="#3aa581" stroke-opacity=".4"/>
      <rect x="840" y="300" width="90" height="170" rx="6" fill="url(#drack)" stroke="#3aa581" stroke-opacity=".4"/>
      <rect x="950" y="300" width="90" height="170" rx="6" fill="url(#drack)" stroke="#3aa581" stroke-opacity=".4"/>
    </g>
    <!-- front row, larger -->
    <g>
      <rect x="430" y="380" width="130" height="320" rx="8" fill="url(#drack)" stroke="#3aa581" stroke-opacity=".5"/>
      <rect x="600" y="380" width="130" height="320" rx="8" fill="url(#drack)" stroke="#3aa581" stroke-opacity=".5"/>
      <rect x="870" y="380" width="130" height="320" rx="8" fill="url(#drack)" stroke="#3aa581" stroke-opacity=".5"/>
      <rect x="1040" y="380" width="130" height="320" rx="8" fill="url(#drack)" stroke="#3aa581" stroke-opacity=".5"/>
    </g>
  </g>
  <!-- status LEDs -->
  <g fill="#E3A92E">
    <g>
      <rect x="450" y="405" width="90" height="6" rx="3"/><rect x="450" y="425" width="60" height="6" rx="3"/>
      <rect x="620" y="405" width="90" height="6" rx="3"/><rect x="620" y="425" width="70" height="6" rx="3"/>
      <rect x="890" y="405" width="90" height="6" rx="3"/><rect x="890" y="425" width="55" height="6" rx="3"/>
      <rect x="1060" y="405" width="90" height="6" rx="3"/><rect x="1060" y="425" width="75" height="6" rx="3"/>
    </g>
  </g>
  <g fill="#7FD0B4">
    <circle cx="465" cy="470" r="5"/><circle cx="635" cy="470" r="5"/><circle cx="905" cy="470" r="5"/><circle cx="1075" cy="470" r="5"/>
    <circle cx="465" cy="500" r="5"/><circle cx="635" cy="500" r="5"/><circle cx="905" cy="500" r="5"/><circle cx="1075" cy="500" r="5"/>
  </g>
  <rect width="1600" height="900" fill="url(#dvig)"/>
</svg>
