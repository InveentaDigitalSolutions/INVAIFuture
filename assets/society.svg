<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#124a39"/><stop offset="100%" stop-color="#06180f"/>
    </linearGradient>
    <linearGradient id="svig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="40%" stop-color="#06180f" stop-opacity="0"/><stop offset="100%" stop-color="#05140d" stop-opacity=".9"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sbg)"/>
  <!-- stacked translucent economy layers -->
  <g opacity=".9">
    <path d="M120 660 L820 470 L1500 640 L800 840 Z" fill="#1c6b52" fill-opacity=".5"/>
    <path d="M160 520 L820 350 L1460 500 L800 680 Z" fill="#2E8B70" fill-opacity=".45"/>
    <path d="M200 390 L820 240 L1420 370 L800 520 Z" fill="#3aa581" fill-opacity=".4"/>
  </g>
  <!-- people-as-nodes network on top layer -->
  <g stroke="#E3A92E" stroke-opacity=".5" stroke-width="1.5">
    <line x1="520" y1="300" x2="700" y2="250"/><line x1="700" y1="250" x2="900" y2="270"/>
    <line x1="900" y1="270" x2="1080" y2="330"/><line x1="700" y1="250" x2="820" y2="360"/>
    <line x1="520" y1="300" x2="640" y2="380"/>
  </g>
  <g fill="#E3A92E">
    <g transform="translate(520,300)"><circle cy="-10" r="11"/><path d="M-16 18 a16 16 0 0 1 32 0 z"/></g>
    <g transform="translate(700,250)"><circle cy="-10" r="11"/><path d="M-16 18 a16 16 0 0 1 32 0 z"/></g>
    <g transform="translate(900,270)"><circle cy="-10" r="11"/><path d="M-16 18 a16 16 0 0 1 32 0 z"/></g>
    <g transform="translate(1080,330)"><circle cy="-10" r="11"/><path d="M-16 18 a16 16 0 0 1 32 0 z"/></g>
  </g>
  <g fill="#bfeede"><g transform="translate(820,360)"><circle cy="-8" r="9"/><path d="M-13 14 a13 13 0 0 1 26 0 z"/></g>
    <g transform="translate(640,380)"><circle cy="-8" r="9"/><path d="M-13 14 a13 13 0 0 1 26 0 z"/></g></g>
  <rect width="1600" height="900" fill="url(#svig)"/>
</svg>
