<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E3B2E"/><stop offset="100%" stop-color="#06180f"/>
    </linearGradient>
    <radialGradient id="wglow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2E8B70" stop-opacity=".5"/><stop offset="100%" stop-color="#2E8B70" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wvig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="45%" stop-color="#06180f" stop-opacity="0"/><stop offset="100%" stop-color="#05140d" stop-opacity=".9"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#wbg)"/>
  <circle cx="800" cy="380" r="430" fill="url(#wglow)"/>
  <!-- dotted world grid sphere -->
  <g transform="translate(800,400)" stroke="#3aa581" stroke-opacity=".4" fill="none">
    <circle r="340"/><ellipse rx="340" ry="110"/><ellipse rx="340" ry="220"/><ellipse rx="110" ry="340"/><ellipse rx="230" ry="340"/>
  </g>
  <!-- connection network -->
  <g stroke="#E3A92E" stroke-opacity=".45" stroke-width="1.6">
    <line x1="470" y1="300" x2="700" y2="220"/><line x1="700" y1="220" x2="980" y2="250"/>
    <line x1="980" y1="250" x2="1180" y2="420"/><line x1="1180" y1="420" x2="980" y2="600"/>
    <line x1="980" y1="600" x2="640" y2="600"/><line x1="640" y1="600" x2="470" y2="450"/>
    <line x1="470" y1="450" x2="470" y2="300"/><line x1="700" y1="220" x2="700" y2="600"/>
    <line x1="980" y1="250" x2="640" y2="600"/>
  </g>
  <g fill="#E3A92E">
    <circle cx="470" cy="300" r="6"/><circle cx="700" cy="220" r="8"/><circle cx="980" cy="250" r="7"/>
    <circle cx="1180" cy="420" r="8"/><circle cx="980" cy="600" r="7"/><circle cx="640" cy="600" r="6"/><circle cx="470" cy="450" r="6"/>
  </g>
  <g fill="#9be3c6" fill-opacity=".9"><circle cx="820" cy="360" r="4"/><circle cx="880" cy="470" r="4"/><circle cx="600" cy="380" r="4"/><circle cx="1050" cy="380" r="4"/></g>
  <rect width="1600" height="900" fill="url(#wvig)"/>
